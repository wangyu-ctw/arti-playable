<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Seedance ×OpenRouter 视频生成</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --bg:#0f1115; --panel:#161a20; --line:#262b33; --fg:#e6e9ee; --dim:#8b93a1; --acc:#4da3ff; --ok:#7ee787; --err:#ff7b72; --warn:#ffb648; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header b { font-size:16px; }
  main { max-width:900px; margin:0 auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
  .blk { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .hint { color:var(--dim); font-size:12px; }
  label { font-size:13px; color:var(--dim); }
  input[type=text], input[type=password], input[type=number], select, textarea {
    background:#0d1014; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:7px 10px; font:inherit; }
  textarea { width:100%; min-height:100px; resize:vertical; }
  button { background:var(--acc); color:#04121f; border:0; border-radius:6px; padding:8px 18px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:#232936; color:var(--fg); font-weight:normal; padding:5px 10px; }
  .thumbs { display:flex; gap:8px; flex-wrap:wrap; }
  .thumbs .th { position:relative; width:84px; height:84px; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .thumbs img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumbs .rm { position:absolute; top:2px; right:2px; background:rgba(0,0,0,.7); color:#fff; border:0; border-radius:4px; padding:0 6px; cursor:pointer; }
  .card { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-top:10px; }
  .card .meta { color:var(--dim); font-size:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .badge { padding:1px 10px; border-radius:999px; font-size:12px; background:#232936; }
  .badge.processing, .badge.pending { color:var(--warn); }
  .badge.completed { color:var(--ok); }
  .badge.failed { color:var(--err); }
  .card video { width:100%; max-height:420px; margin-top:8px; background:#000; border-radius:6px; }
  .err { color:var(--err); white-space:pre-wrap; }
  a { color:var(--acc); }
</style>
</head>
<body>
<header>
  <b>🎬 Seedance ×OpenRouter</b>
  <span class="hint">POST /api/v1/videos 异步生成，本页自动轮询拉结果；key 与 audio 工具共用 localStorage["openrouter_key"]</span>
</header>
<main>
  <div class="blk">
    <div class="row">
      <label>OpenRouter Key</label>
      <input id="key" type="password" placeholder="sk-or-v1-…" style="flex:1;min-width:260px">
      <button class="ghost" id="keyEye">显示</button>
      <span class="hint" id="keyMsg"></span>
    </div>
    <div class="row">
      <label>模型</label>
      <select id="model" style="min-width:260px"></select>
      <label>时长</label><select id="dur"></select><span class="hint">s</span>
      <label>分辨率</label><select id="res"></select>
      <label>画幅</label><select id="ar"></select>
      <label><input id="audio" type="checkbox" checked> 生成音频</label>
    </div>
    <div class="row"><span class="hint" id="modelHint"></span></div>
  </div>

  <div class="blk">
    <div class="row"><label style="width:100%">提示词</label></div>
    <textarea id="prompt" placeholder="镜头语言 + 画面描述…（Seedance 2.5 支持中文/日文/英文提示词）"></textarea>
    <div class="row">
      <label>首帧</label><input id="firstF" type="file" accept="image/*"><button class="ghost" id="firstClr" hidden>✕</button>
      <label>尾帧</label><input id="lastF" type="file" accept="image/*"><button class="ghost" id="lastClr" hidden>✕</button>
      <span class="hint">（填了首/尾帧 = 图生视频，参考图将被忽略）</span>
    </div>
    <div class="row thumbs" id="frameThumbs"></div>
    <div class="row">
      <label>参考图（可多张，风格/主体参考）</label>
      <input id="refFile" type="file" accept="image/*" multiple>
    </div>
    <div class="thumbs" id="refThumbs"></div>
    <div class="row hint">参考视频 / omni_reference_task_type 是 artifex 版专属能力，OpenRouter 的 Seedance 暂不支持（要用请回 seedance.html）</div>
    <div class="row">
      <label>seed</label><input id="seed" type="number" style="width:130px" placeholder="随机">
      <span style="flex:1"></span>
      <button id="go">提交生成</button>
    </div>
  </div>

  <div class="blk">
    <b>生成区</b><span class="hint">（任务存 localStorage，刷新页面自动恢复轮询；每 5s 拉一次状态）</span>
    <div id="jobs"><div class="hint">还没有任务。</div></div>
  </div>
</main>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const API = 'https://openrouter.ai/api/v1';
  const KEY = 'openrouter_key';                       // 与 audio.html 共用
  const JOBS_LS = 'seedance2_jobs';

  // ---- key ----
  $('#key').value = localStorage.getItem(KEY) || '';
  $('#key').addEventListener('change', () => { localStorage.setItem(KEY, $('#key').value.trim()); $('#keyMsg').textContent = '已保存'; setTimeout(() => $('#keyMsg').textContent = '', 1500); });
  $('#keyEye').onclick = () => { const k = $('#key'); k.type = k.type === 'password' ? 'text' : 'password'; $('#keyEye').textContent = k.type === 'password' ? '显示' : '隐藏'; };
  const auth = () => ({ Authorization: 'Bearer ' + ($('#key').value || '').trim(), 'Content-Type': 'application/json', 'X-Title': 'arti-playable seedance2' });

  // ---- 模型与能力（线上拉取，seedance 靠前；时长/分辨率/画幅按所选模型的支持范围联动）----
  let models = [{ id: 'bytedance/seedance-2.5', supported_durations: [4,5,6,7,8,9,10,15,20,30], supported_resolutions: ['480p','720p'], supported_aspect_ratios: ['16:9','4:3','1:1','3:4','9:16','21:9'] }];
  const fillSel = (el, arr, cur) => { el.innerHTML = (arr || []).map(v => `<option>${v}</option>`).join(''); if (arr && arr.includes(cur)) el.value = cur; };
  function syncCaps() {
    const m = models.find(x => x.id === $('#model').value) || models[0];
    fillSel($('#dur'), m.supported_durations || [5], $('#dur').value);
    fillSel($('#res'), m.supported_resolutions || ['720p'], $('#res').value || '720p');
    fillSel($('#ar'), m.supported_aspect_ratios || ['9:16'], $('#ar').value || '9:16');
    const p = m.pricing_skus || {};
    $('#modelHint').textContent = Object.keys(p).length ? ('计价: ' + Object.entries(p).slice(0, 3).map(([k, v]) => `${k}=$${v}`).join(' · ')) : '';
  }
  function renderModels() {
    const cur = $('#model').value;
    $('#model').innerHTML = models.map(m => `<option>${m.id}</option>`).join('');
    $('#model').value = models.some(m => m.id === cur) ? cur : (models.find(m => /seedance-2\.5/.test(m.id)) || models[0]).id;
    syncCaps();
  }
  $('#model').onchange = syncCaps;
  renderModels();
  fetch(API + '/videos/models').then(r => r.json()).then(j => {
    const all = (j.data || []);
    all.sort((a, b) => (/seedance/.test(b.id) ? 1 : 0) - (/seedance/.test(a.id) ? 1 : 0) || a.id.localeCompare(b.id));
    if (all.length) { models = all; renderModels(); }
  }).catch(() => {});

  // ---- 图片上传 ----
  const file2dataURL = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
  let firstImg = null, lastImg = null; const refs = [];
  const bindFrame = (inputId, clrId, set) => {
    $(inputId).addEventListener('change', async e => { const f = e.target.files[0]; set(f ? await file2dataURL(f) : null); $(clrId).hidden = !f; renderFrames(); });
    $(clrId).onclick = () => { set(null); $(inputId).value = ''; $(clrId).hidden = true; renderFrames(); };
  };
  bindFrame('#firstF', '#firstClr', v => firstImg = v);
  bindFrame('#lastF', '#lastClr', v => lastImg = v);
  function renderFrames() {
    $('#frameThumbs').innerHTML = (firstImg ? `<div class="th" title="首帧"><img src="${firstImg}"></div>` : '') + (lastImg ? `<div class="th" title="尾帧"><img src="${lastImg}"></div>` : '');
  }
  $('#refFile').addEventListener('change', async e => { for (const f of e.target.files) refs.push(await file2dataURL(f)); e.target.value = ''; renderRefs(); });
  function renderRefs() {
    $('#refThumbs').innerHTML = refs.map((u, i) => `<div class="th"><img src="${u}"><button class="rm" data-i="${i}">✕</button></div>`).join('');
    $('#refThumbs').querySelectorAll('.rm').forEach(b => b.onclick = () => { refs.splice(+b.dataset.i, 1); renderRefs(); });
  }

  // ---- 任务：提交 / 轮询（5s）/ 恢复 ----
  const jobs = JSON.parse(localStorage.getItem(JOBS_LS) || '[]');   // [{id, model, prompt, ts, status, url?, error?}]
  const saveJobs = () => localStorage.setItem(JOBS_LS, JSON.stringify(jobs.slice(0, 30)));
  function jobCard(j) {
    let el = document.querySelector(`.card[data-id="${j.id}"]`);
    if (!el) {
      if ($('#jobs .hint')) $('#jobs').innerHTML = '';
      el = document.createElement('div'); el.className = 'card'; el.dataset.id = j.id;
      $('#jobs').prepend(el);
    }
    el.innerHTML = `<div class="meta"><span class="badge ${j.status}">${j.status}</span><span>${j.model}</span>
      <span>${new Date(j.ts).toLocaleTimeString()}</span><span style="flex:1"></span>
      <button class="ghost rf">立即刷新</button></div>
      <div class="hint" style="margin-top:4px">${(j.prompt || '').slice(0, 120)}</div>
      ${j.status === 'completed' && j.url ? `<video controls playsinline src="${j.url}"></video><div><a href="${j.url}" target="_blank">在新窗口打开 / 右键另存</a></div>` : ''}
      ${j.status === 'failed' ? `<div class="err">${j.error || '生成失败'}</div>` : ''}`;
    el.querySelector('.rf').onclick = () => poll(j, true);
    return el;
  }
  async function poll(j, manual) {
    if (j.status === 'completed' || (j.status === 'failed' && !manual)) return;
    try {
      const r = await fetch(`${API}/videos/${j.id}`, { headers: auth() });
      const s = await r.json();
      if (!r.ok) throw new Error(s.error && s.error.message || ('HTTP ' + r.status));
      j.status = s.status || j.status;
      if (s.status === 'completed') j.url = (s.unsigned_urls && s.unsigned_urls[0]) || j.url;
      if (s.status === 'failed') j.error = typeof s.error === 'string' ? s.error : JSON.stringify(s.error || '');
    } catch (e) { if (manual) { j.error = e.message; } }
    saveJobs(); jobCard(j);
  }
  setInterval(() => { jobs.filter(j => j.status !== 'completed' && j.status !== 'failed').forEach(j => poll(j)); }, 5000);
  jobs.forEach(j => { jobCard(j); poll(j); });   // 恢复历史并立即拉一次

  $('#go').onclick = async () => {
    const key = ($('#key').value || '').trim();
    if (!key) return alert('先填 OpenRouter Key（sk-or-v1-…）');
    const prompt = $('#prompt').value.trim();
    if (!prompt) return alert('提示词不能为空');
    const body = {
      model: $('#model').value, prompt,
      duration: +$('#dur').value, resolution: $('#res').value, aspect_ratio: $('#ar').value,
      generate_audio: $('#audio').checked,
    };
    if ($('#seed').value !== '') body.seed = Math.round(+$('#seed').value);
    const frames = [];
    if (firstImg) frames.push({ type: 'image_url', image_url: { url: firstImg }, frame_type: 'first_frame' });
    if (lastImg) frames.push({ type: 'image_url', image_url: { url: lastImg }, frame_type: 'last_frame' });
    if (frames.length) body.frame_images = frames;
    else if (refs.length) body.input_references = refs.map(u => ({ type: 'image_url', image_url: { url: u } }));
    $('#go').disabled = true;
    try {
      const r = await fetch(API + '/videos', { method: 'POST', headers: auth(), body: JSON.stringify(body) });
      const s = await r.json();
      if (!r.ok || !s.id) throw new Error(s.error && (s.error.message || JSON.stringify(s.error)) || ('HTTP ' + r.status));
      const j = { id: s.id, model: body.model, prompt, ts: Date.now(), status: s.status || 'pending' };
      jobs.unshift(j); saveJobs(); jobCard(j);
      setTimeout(() => poll(j), 3000);   // 提交后 3s 先拉一次，之后进 5s 轮询
    } catch (e) { alert('提交失败：' + e.message); }
    finally { $('#go').disabled = false; }
  };
})();
</script>
</body>
</html>
